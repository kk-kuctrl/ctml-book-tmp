<title>『システム制御理論と統計的機械学習』数値例 (Native JS)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">『システム制御理論と統計的機械学習』数値例 <span class="brand-badge">Native JS</span></div>
    </div>
    <nav id="figure-list" class="figure-list" aria-label="Figure一覧"></nav>
  </aside>

  <main class="panel">
    <header class="panel-header">
      <div class="title-block">
        <h1 id="fig-title">Figure を選択してください</h1>
        <p id="fig-note" class="fig-note"></p>
      </div>
      <div class="controls">
        <span id="status" class="status"></span>
        <button id="run-btn" class="run-btn" disabled>Run ▶</button>
      </div>
    </header>

    <div id="params-panel" class="params-panel"></div>
    <div id="output-grid" class="output-grid"></div>
    <p id="output-hint" class="hint">左のリストからFigureを選び、「Run」を押してください。ブラウザのJavaScriptだけでその場で計算・描画するので、待ち時間はほぼありません。</p>

    <footer id="method-note" class="notes" style="display: none;">
      <p id="method-note-text"></p>
    </footer>
  </main>
</div>
